<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeiSHOW</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f0f0f; color: #e0e0e0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .container { text-align: center; max-width: 600px; padding: 2rem; }
    h1 { font-size: 3rem; margin-bottom: 0.5rem; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p { font-size: 1.1rem; color: #999; margin-bottom: 2rem; line-height: 1.6; }
    .links { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .links a { padding: 0.75rem 2rem; border-radius: 8px; text-decoration: none; font-weight: 500; transition: transform 0.2s, box-shadow 0.2s; }
    .links a:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4); }
    .btn-blog { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
    .btn-github { background: #333; color: #ccc; }
  </style>
</head>
<body>
  <div class="container">
    <h1>雷樱者 / LeiSHOW</h1>
    <p>计算机技术 · 无人自组织网络 · 持续构建中</p>
    <div class="links">
      <a href="/blog/" class="btn-blog">📝 博客</a>
      <a href="https://github.com/leiSHOW" class="btn-github">GitHub</a>
    </div>
  </div>
</body>
</html>
