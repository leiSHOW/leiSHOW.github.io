<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fa">
  <meta name="description" content="雷樱者的个人主页：嵌入式系统、Linux 平台开发与无人自组织网络。">
  <title>LeiSHOW · 雷樱者</title>
  <link rel="canonical" href="https://leishow.github.io/">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f6f8; --surface: #fff; --surface-soft: #edf2fc;
      --text: #152536; --secondary: #526176; --muted: #607086;
      --accent: #3559c7; --border: #dce3eb;
      --sans: -apple-system, BlinkMacSystemFont, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      --serif: "Noto Serif SC", "Songti SC", "STSong", serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #101923; --surface: #182432; --surface-soft: #213350; --text: #edf2f8; --secondary: #bdc9d8; --muted: #adbdcf; --accent: #a6bcff; --border: #344558; }
    }
    * { box-sizing: border-box; }
    html { font-family: var(--sans); }
    body { min-height: 100vh; margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; }
    .skip-link { position: absolute; top: -5rem; left: 1rem; z-index: 10; padding: .8rem 1rem; background: var(--surface); border-radius: 6px; }
    .skip-link:focus { top: 1rem; }
    .site-header, .site-footer, main { width: min(100% - 4rem, 1120px); margin-inline: auto; }
    .site-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding-block: 1.2rem; border-bottom: 1px solid var(--border); }
    .logo { color: var(--text); font-size: 1.2rem; font-weight: 650; letter-spacing: -.025em; }
    .logo::before { content: 'L'; display: inline-grid; place-items: center; width: 30px; height: 30px; margin-right: .65rem; border: 1px solid var(--accent); border-radius: 8px; color: var(--accent); font-family: var(--serif); font-weight: 500; }
    .site-nav { display: flex; flex-wrap: wrap; gap: .25rem 1.5rem; align-items: center; }
    .site-nav a { min-height: 44px; display: inline-flex; align-items: center; color: var(--secondary); font-size: .92rem; }
    .site-nav a:hover { color: var(--accent); }
    main { flex: 1; display: grid; align-items: center; padding-block: clamp(2.75rem, 6vw, 5.5rem); }
    .name-card { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: clamp(2rem, 7vw, 6rem); align-items: center; }
    .identity { min-width: 0; padding-block: 1rem; }
    .hero-avatar { display: block; width: 64px; height: 64px; object-fit: cover; border-radius: 50%; border: 1px solid var(--border); margin-bottom: 1.7rem; }
    .greeting { margin: 0 0 .9rem; color: var(--secondary); font-size: .92rem; }
    h1 { margin: 0; font: 500 clamp(3rem, 5.5vw, 4.5rem)/1.25 var(--serif); letter-spacing: .04em; }
    .role { margin: 1.5rem 0 0; font-size: 1.12rem; font-weight: 550; line-height: 1.8; }
    .description { max-width: 29rem; margin: .85rem 0 0; color: var(--secondary); font-size: 1rem; line-height: 1.95; }
    .identity-links { display: flex; flex-wrap: wrap; align-items: center; gap: .8rem 1.5rem; margin-top: 2rem; }
    .identity-links a { display: inline-flex; align-items: center; min-height: 46px; color: var(--accent); font-size: .94rem; }
    .identity-links .primary { padding: .65rem 1.15rem; color: #fff; border-radius: 8px; background: #3559c7; }
    .identity-links .primary:hover { background: #2848a8; }
    .identity-links a:not(.primary):hover { text-decoration: underline; text-underline-offset: 5px; }
    .focus-list { display: flex; flex-wrap: wrap; gap: .5rem 1rem; margin-top: 2rem; padding-top: 1.25rem; border-top: 1px solid var(--border); color: var(--secondary); font-size: .8rem; }
    .actions { min-width: 0; }
    .actions-label { margin: 0 0 1rem; color: var(--secondary); font-size: .9rem; font-weight: 500; }
    .hero-links { display: grid; grid-template-columns: 1fr 1fr; gap: .9rem; }
    .entry { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; padding: 1.55rem; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); transition: border-color .18s ease, box-shadow .18s ease; }
    .entry:hover { border-color: var(--accent); box-shadow: 0 8px 24px #15253608; }
    .entry.featured { grid-column: 1 / -1; background: var(--surface-soft); border-color: transparent; }
    .entry.featured:hover { border-color: var(--accent); }
    .entry svg { width: 25px; height: 25px; color: var(--accent); margin-bottom: 1.2rem; flex: none; }
    .entry h2 { margin: 0 0 .55rem; font-size: 1.15rem; font-weight: 600; }
    .entry p { margin: 0 0 1.4rem; color: var(--secondary); font-size: .9rem; line-height: 1.85; }
    .entry span { display: flex; justify-content: space-between; gap: 1rem; width: 100%; margin-top: auto; color: var(--accent); font-size: .84rem; }
    .entry span b { font-size: 1.1rem; font-weight: 400; }
    .site-footer { display: flex; justify-content: space-between; flex-wrap: wrap; align-items: center; gap: .6rem 1rem; padding-block: 1.25rem; border-top: 1px solid var(--border); color: var(--muted); font-size: .84rem; }
    .footer-links { display: flex; align-items: center; gap: 1.5rem; }
    .footer-links a { display: inline-flex; min-height: 44px; align-items: center; }
    .footer-links a:hover { color: var(--accent); }
    @media (max-width: 850px) {
      .name-card { gap: 2rem; grid-template-columns: 1fr 1fr; }
      .hero-links { grid-template-columns: 1fr; }
      .entry { padding: 1.25rem; }
      .entry svg { margin-bottom: .8rem; }
      .entry p { margin-bottom: 1rem; }
    }
    @media (max-width: 650px) {
      .site-header, .site-footer, main { width: calc(100% - 2.5rem); }
      .site-header { flex-wrap: wrap; gap: .4rem 1rem; padding-block: .8rem; }
      .site-nav { gap: .2rem 1.15rem; }
      .site-nav a { font-size: .88rem; }
      .name-card { grid-template-columns: 1fr; gap: 2.5rem; }
      .identity { padding: 0; }
      .role { font-size: 1.05rem; }
      .hero-avatar { width: 56px; height: 56px; margin-bottom: 1.3rem; }
      .hero-links { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .entry h2 { font-size: 1.05rem; }
    }
    @media (max-width: 380px) { .hero-links { grid-template-columns: 1fr; } }
    @media (prefers-reduced-motion: reduce) { .entry { transition: none; } }
  </style>
</head>
<body>

    </section>
  </main>
  <footer class="site-footer"><span>© 2026 LeiSHOW</span><div class="footer-links"><a href="/blog/about/">关于我</a><a href="https://github.com/leiSHOW" target="_blank" rel="noopener noreferrer">GitHub ↗</a></div></footer>
