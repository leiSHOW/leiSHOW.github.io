<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fa">
  <meta name="description" content="雷樱者的个人主页：嵌入式系统、Linux 平台开发与无人自组织网络。">
  <title>LeiSHOW · 雷樱者</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f7fa;
      --surface: #fff;
      --surface-soft: #f8faff;
      --text: #172334;
      --secondary: #536175;
      --muted: #69778a;
      --accent: #3559c7;
      --accent-soft: #edf2ff;
      --border: #dce3ed;
      --shadow: 0 24px 70px rgba(25, 43, 74, .08);
      --sans: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      --serif: "Noto Serif SC", "STSong", "Songti SC", serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101722;
        --surface: #192331;
        --surface-soft: #1c293b;
        --text: #edf2f8;
        --secondary: #c0cad6;
        --muted: #a5b2c1;
        --accent: #91afff;
        --accent-soft: #253654;
        --border: #354457;
        --shadow: 0 24px 70px rgba(0, 0, 0, .22);
      }
    }
    * { box-sizing: border-box; }
    html { font-family: var(--sans); }
    body { min-height: 100vh; margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
    a { color: inherit; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .site-header, .site-footer { width: min(100% - 3rem, 1040px); margin-inline: auto; }
    .site-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1.65rem 0; }
    .logo { color: var(--accent); font-size: 1.2rem; font-weight: 600; letter-spacing: .02em; text-decoration: none; }
    .site-nav { display: flex; flex-wrap: wrap; gap: .35rem 1.6rem; align-items: center; }
    .site-nav a { min-height: 2.75rem; display: inline-flex; align-items: center; color: var(--secondary); font-size: .96rem; text-decoration: none; }
    .site-nav a:hover { color: var(--accent); }
    main { flex: 1; width: min(100% - 3rem, 1040px); margin: auto; display: grid; align-items: center; padding: 1.5rem 0 3rem; }
    .name-card { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(17rem, .82fr); overflow: hidden; background: var(--surface); border: 1px solid var(--border); border-radius: 24px; box-shadow: var(--shadow); }
    .identity { min-width: 0; padding: clamp(2rem, 5vw, 4.2rem); }
    .hero-avatar { display: block; width: 84px; height: 84px; object-fit: cover; border-radius: 50%; border: 2px solid var(--border); margin-bottom: 2rem; }
    .greeting { margin: 0 0 .6rem; color: var(--accent); font-size: .9rem; font-weight: 600; letter-spacing: .07em; }
    h1 { margin: 0; font: 500 clamp(2.35rem, 5vw, 3.4rem)/1.25 var(--serif); letter-spacing: .025em; }
    .role { margin: 1.1rem 0 0; font-size: 1.05rem; font-weight: 500; line-height: 1.7; }
    .description { max-width: 31rem; margin: 1rem 0 0; color: var(--secondary); font-size: 1rem; line-height: 1.85; }
    .actions { display: flex; flex-direction: column; justify-content: center; min-width: 0; padding: clamp(1.5rem, 3.6vw, 3rem); border-left: 1px solid var(--border); background: var(--surface-soft); }
    .actions-label { margin: 0 0 1rem; color: var(--muted); font-size: .88rem; font-weight: 500; letter-spacing: .04em; }
    .hero-links { display: grid; gap: .75rem; }
    .hero-links a { display: flex; align-items: center; gap: .8rem; min-height: 3.5rem; padding: .7rem 1rem; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); font-size: 1rem; font-weight: 500; text-decoration: none; transition: border-color .16s ease, transform .16s ease, background .16s ease; }
    .hero-links a:hover { transform: translateY(-2px); border-color: var(--accent); }
    .hero-links a.primary { color: #fff; background: #3559c7; border-color: #3559c7; }
    .hero-links a.primary:hover { background: #2e4eb2; }
    .hero-links a svg { width: 1.1rem; height: 1.1rem; flex: none; color: var(--accent); }
    .hero-links a.primary svg { color: #fff; }
    .hero-links a .arrow { margin-left: auto; color: var(--muted); font-size: 1.15rem; font-weight: 400; }
    .hero-links a.primary .arrow { color: rgba(255,255,255,.8); }
    .site-footer { display: flex; justify-content: space-between; gap: .75rem; padding: 1rem 0 2rem; color: var(--muted); font-size: .88rem; }
    .heart { color: var(--accent); }
    @media (max-width: 760px) {
      .name-card { grid-template-columns: 1fr; }
      .identity { padding: 2.3rem 2.3rem 2rem; }
      .actions { border-left: 0; border-top: 1px solid var(--border); padding: 1.6rem 2.3rem 2.3rem; }
      .hero-links { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .hero-links a:last-child:nth-child(odd) { grid-column: 1 / -1; }
      .hero-avatar { margin-bottom: 1.4rem; }
    }
    @media (max-width: 520px) {
      .site-header, .site-footer, main { width: min(100% - 2rem, 1040px); }
      .site-header { flex-wrap: wrap; padding: 1rem 0; }
      .site-nav { gap: .2rem 1rem; }
      .site-nav a { font-size: .9rem; }
      main { padding: .7rem 0 2rem; }
      .name-card { border-radius: 18px; }
      .identity { padding: 1.65rem 1.4rem 1.55rem; }
      .actions { padding: 1.35rem 1.4rem 1.55rem; }
      .hero-avatar { width: 72px; height: 72px; margin-bottom: 1.2rem; }
      .role { font-size: 1rem; }
      .hero-links { gap: .6rem; }
      .hero-links a { gap: .5rem; padding: .7rem .75rem; font-size: .92rem; }
      .site-footer { flex-wrap: wrap; font-size: .82rem; }
    }
    @media (max-width: 360px) { .hero-links { grid-template-columns: 1fr; } }
    @media (prefers-reduced-motion: reduce) { .hero-links a { transition: none; } }
  </style>
</head>
<body>
